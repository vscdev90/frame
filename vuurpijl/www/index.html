<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1230">
  <title>Rocket!</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <!-- in-flight HUD -->
  <div id="hud" class="hidden">
    <div class="hud-row">
      <div class="pill" id="hud-height">0 m</div>
      <div class="pill" id="hud-coins">🪙 0</div>
    </div>
    <div class="fuelbar"><div id="hud-fuel"></div></div>
    <div id="hud-goal"></div>
    <div class="hud-row small">
      <div><span id="hud-wx"></span> <span id="hud-power"></span></div>
      <div id="hud-combo"></div>
    </div>
    <div id="hud-zone"></div>
    <button id="btn-turbo" class="hidden">⚡ TURBO <span id="turbo-n"></span></button>
  </div>

  <!-- lighting the fuse -->
  <div id="ignite" class="hidden">
    <div class="ignite-hint" id="ignite-hint">Light the fuse!</div>
    <button id="btn-light" class="big" data-i18n="lightBtn">🔥 LIGHT FUSE</button>
  </div>

  <!-- the shed: your rocket on the pad, the upgrades below it, everything else behind a few icons -->
  <div id="shop" class="hidden">
    <header class="shop-head">
      <div class="wallet"><span id="shop-coins">0</span> 🪙</div>
      <div class="head-mid">
        <div class="record"><span data-i18n="record">Record</span> <b id="shop-record">0 m</b></div>
        <div class="progress"><div id="moon-progress"></div><span class="moon-ico" id="goal-ico">🌕</span></div>
        <div class="universe" id="shop-universe"></div>
      </div>
      <button id="btn-sound" class="ghost round" aria-label="Sound">🔊</button>
    </header>
    <section class="sheet">
      <!-- everything besides the upgrades: a row of icons just above the sheet -->
      <nav class="rail">
        <button id="btn-missions" class="rail-btn hidden" aria-label="Daily missions">📋<i class="dot hidden"></i></button>
        <button id="btn-pass" class="rail-btn hidden" aria-label="Rocket Pass">🎫<i class="dot hidden"></i></button>
        <button id="btn-event" class="rail-btn hidden" aria-label="Event"><span id="event-ico">🎃</span><small id="event-count"></small></button>
        <button id="btn-hangar" class="rail-btn hidden" aria-label="Rockets and launch sites">🚀<i class="dot hidden"></i></button>
        <button id="btn-collection" class="rail-btn" aria-label="Collection">🏆<i class="dot hidden"></i></button>
        <div id="prestige" class="hidden"><button id="btn-prestige" class="rail-btn glow" aria-label="New universe">🌌</button></div>
      </nav>
      <div class="evo">
        <div class="evo-info"><b class="evo-name" id="evo-name"></b> <span class="evo-mult" id="evo-mult"></span><div class="evo-need" id="evo-need"></div></div>
        <button id="btn-evolve" class="buy"></button>
      </div>
      <section class="upgrades" id="upgrades"></section>
      <div class="launch-row">
        <section id="ad-boost" class="adpill hidden"><span id="ad-boost-text"></span><button id="btn-ad-boost" class="buy">📺 FREE</button></section>
        <button id="btn-launch" class="big" data-i18n="launchBtn">🚀 LAUNCH</button>
      </div>
    </section>
  </div>

  <!-- daily missions -->
  <div id="missionsview" class="panel hidden">
    <header class="shop-top">
      <div class="title small" data-i18n="missionsTitle">Daily missions</div>
      <button class="ghost lang" data-close="missionsview" aria-label="Close">✕</button>
    </header>
    <section id="missions"></section>
  </div>

  <!-- what you launch, and from where -->
  <div id="hangar" class="panel hidden">
    <header class="shop-top">
      <div class="title small" data-i18n="hangarTitle">Hangar</div>
      <button class="ghost lang" data-close="hangar" aria-label="Close">✕</button>
    </header>
    <div class="sub" data-i18n="catFire">Fireworks</div>
    <section class="chips grid" id="types-fire"></section>
    <div class="sub" data-i18n="catFun">Crazy stuff</div>
    <section class="chips grid" id="types-fun"></section>
    <div class="sub" data-i18n="catMachine">Machines</div>
    <section class="chips grid" id="types-machine"></section>
    <h3 class="sec" data-i18n="siteHead">Launch site</h3>
    <section class="chips grid" id="sites"></section>
  </div>

  <!-- a seasonal event, only while it runs -->
  <div id="eventview" class="panel hidden">
    <header class="shop-top">
      <div class="title small" id="event-head"></div>
      <button class="ghost lang" data-close="eventview" aria-label="Close">✕</button>
    </header>
    <section id="event" class="event">
      <div class="ev-top"><b id="event-title"></b><span id="event-days"></span></div>
      <div class="ev-text" id="event-text"></div>
      <div class="bar"><i id="event-bar"></i></div>
    </section>
    <div class="ev-how" id="event-how"></div>
    <section class="ev-steps" id="event-steps"></section>
  </div>

  <!-- flight result: how high, how much, and straight back up -->
  <div id="result" class="panel card hidden">
    <div class="result-title" id="res-title">BANG!</div>
    <div class="res-height" id="res-height"></div>
    <div class="res-record hidden" id="res-record" data-i18n="newRecord">🏆 NEW RECORD!</div>
    <div class="res-close hidden" id="res-close"></div>
    <div class="res-zone hidden" id="res-zone-line"><span id="res-zone"></span></div>
    <div class="res-total"><b id="res-total"></b></div>
    <div class="res-details">
      <span>🪙 <b id="res-coins"></b></span><span>💥 <b id="res-bonus"></b></span><span>🔥 <b id="res-combo"></b></span><span id="res-pass-wrap">🎫 <b id="res-pass"></b></span>
    </div>
    <div class="res-badges hidden" id="res-ach-line"><span id="res-badges"></span> <b id="res-ach"></b></div>
    <!-- the next thing to buy, right here, so one more flight is always one tap away -->
    <div class="res-next" id="res-next">
      <div class="rn-text" id="res-next-text"></div>
      <div class="bar"><i id="res-next-bar"></i></div>
      <button id="btn-res-buy" class="buy hidden"></button>
    </div>
    <button id="btn-again" class="big again" data-i18n="again">🚀 FLY AGAIN</button>
    <div class="res-buttons">
      <button id="btn-share" class="ghost wide" data-i18n="share">📤 SHARE</button>
      <button id="btn-ad-double" class="buy hidden" data-i18n="adDouble">📺 2× COINS</button>
      <button id="btn-continue" class="ghost wide" data-i18n="toShed">🛠️ SHED</button>
    </div>
  </div>

  <!-- collection: skins, achievements, star map -->
  <div id="collection" class="panel hidden">
    <header class="shop-top">
      <div class="title small" data-i18n="collection">Collection</div>
      <button id="btn-close-collection" class="ghost lang" data-close="collection" aria-label="Close">✕</button>
    </header>
    <div class="record" id="col-stats"></div>
    <h3 class="sec" data-i18n="skinsHead">Skins</h3>
    <section class="chips" id="skins"></section>
    <h3 class="sec" data-i18n="mapHead">Star map</h3>
    <section class="starmap" id="starmap"></section>
    <h3 class="sec" data-i18n="achHead">Achievements</h3>
    <section class="badges" id="badges"></section>
    <h3 class="sec" data-i18n="settingsHead">Settings</h3>
    <section class="settings">
      <button id="btn-tilt" class="ghost wide"></button>
      <button id="btn-notify" class="ghost wide hidden"></button>
      <button id="btn-privacy" class="ghost wide hidden" data-i18n="privacy">Privacy &amp; ad settings</button>
      <button id="btn-reset" class="ghost wide danger" data-i18n="resetBtn">↺ Start over</button>
    </section>
  </div>

  <!-- Rocket Pass: every tier and its prize -->
  <div id="passview" class="panel hidden">
    <header class="shop-top">
      <div class="title small" data-i18n="passTitle">Rocket Pass</div>
      <button id="btn-close-pass" class="ghost lang" data-close="passview" aria-label="Close">✕</button>
    </header>
    <section id="pass" class="pass">
      <div class="ev-top"><b id="pass-tier"></b><span id="pass-days"></span></div>
      <div class="ev-text" id="pass-next"></div>
      <div class="bar"><i id="pass-bar"></i></div>
    </section>
    <div class="record" id="pass-info"></div>
    <section class="tiers" id="pass-tiers"></section>
  </div>

  <div id="countdown" class="hidden"></div>

  <!-- splash screen; a tap also starts the audio (browsers need a gesture) -->
  <div id="splash">
    <div class="splash-rocket">🚀</div>
    <div class="splash-title">ROCKET<span>!</span></div>
    <div class="splash-sub">Light it. Fly it. Blow it up.</div>
    <div class="splash-event" id="splash-event"></div>
    <div class="splash-tap">Tap to start</div>
  </div>

  <!-- our own yes/no dialog: Android's WebView does not show window.confirm -->
  <div id="modal" class="hidden">
    <div class="modal-box">
      <div id="modal-text"></div>
      <div class="modal-buttons">
        <button id="modal-no" class="ghost wide" data-i18n="no">Cancel</button>
        <button id="modal-yes" class="big" data-i18n="yes">YES</button>
      </div>
    </div>
  </div>

  <!-- rewards: welcome back, daily streak, mystery boxes -->
  <div id="reward" class="hidden">
    <div class="modal-box reward-box">
      <div class="reward-icon" id="reward-icon">🎁</div>
      <div class="reward-title" id="reward-title"></div>
      <div class="reward-days" id="reward-days"></div>
      <div class="reward-text" id="reward-text"></div>
      <div class="modal-buttons">
        <button id="reward-ad" class="buy hidden"></button>
        <button id="reward-ok" class="big" data-i18n="collect">COLLECT</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="logic.js"></script>
  <script src="meta.js"></script>
  <script src="i18n.js"></script>
  <script src="game.js"></script>
</body>
</html>
