name: Rocket! APK and Play bundle

on:
  push:
    paths:
      - 'vuurpijl/**'
      - '.github/workflows/vuurpijl-apk.yml'
  workflow_dispatch:

permissions:
  contents: write   # to publish the APK as a release

jobs:
  apk:
    runs-on: ubuntu-24.04  # Playwright 1.56 does not support ubuntu-latest (26.04) yet
    env:
      # true once the Play Store upload key is stored as GitHub secrets (see vuurpijl/DEPLOY.md)
      HAS_UPLOAD_KEY: ${{ secrets.UPLOAD_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check
        run: for f in vuurpijl/www/*.js; do node --check "$f"; done

      - name: Balance check (the moon is reachable, but not too fast)
        run: node vuurpijl/tests/balance.mjs

      - name: Missions, achievements, weather and prestige
        run: node vuurpijl/tests/meta.mjs

      - name: Play the game in a browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          (cd vuurpijl/www && python3 -m http.server 8898 >/tmp/serve.log 2>&1 &)
          for i in $(seq 1 20); do curl -sf http://localhost:8898/index.html >/dev/null && break; sleep 0.5; done
          node vuurpijl/tests/play.mjs
        env:
          PLAYWRIGHT_MODULE: playwright

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      # The hobby APK: sideload it to test (Google's test ads).
      # The Play bundle is always built so a broken store build shows up here.
      - name: Build the test APK and the Play Store bundle
        working-directory: vuurpijl/android
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
        run: |
          chmod +x gradlew
          if [ "$HAS_UPLOAD_KEY" = "true" ]; then
            echo "$UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            export UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.jks"
            [ -n "$ADMOB_APP_ID" ] || echo "::warning::ADMOB_APP_ID is not set, so the Play bundle shows Google's TEST ads"
          else
            echo "::notice::No upload key yet: the Play bundle is built unsigned and not uploaded (see vuurpijl/DEPLOY.md)"
          fi
          ./gradlew --no-daemon assembleHobbyRelease bundlePlayRelease
          cp app/build/outputs/apk/hobby/release/app-hobby-release.apk "$GITHUB_WORKSPACE/Rocket.apk"
          cp app/build/outputs/bundle/playRelease/app-play-release.aab "$GITHUB_WORKSPACE/Rocket-play.aab"
          rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: Rocket-apk
          path: Rocket.apk

      # The signed bundle goes to the (private) run artifacts, never to the public release.
      - uses: actions/upload-artifact@v4
        if: env.HAS_UPLOAD_KEY == 'true'
        with:
          name: Rocket-play-bundle
          path: Rocket-play.aab

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rocket-v${{ github.run_number }}
          name: Rocket! build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: Rocket.apk
          body: |
            Download **Rocket.apk** on your Android phone and open it.
            Allow "install unknown apps" if your phone asks.
            This is the test build (Google's test ads). The Play Store bundle is a private run artifact.
